# Builds the PCF4U Android app with sparkfabrik/android-build-action.
#
#  - APK (app-release.apk): always built – install it directly on phones.
#  - AAB (app-release.aab): built when the signing secrets below exist – upload it to Google Play.
#  - Optional: upload the AAB to the Play Store "internal" track (manual run, tick the box).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    output of:  base64 -w0 pcf4u-upload.keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password (the action uses it for the key too,
#                              so create the key with the SAME key password)
#   ANDROID_KEY_ALIAS          e.g. pcf4u
#   PLAY_STORE_JSON_KEY        (only for Play upload) Google Play service-account JSON, on ONE line
#
# PCF4U is an Expo project: the android/ folder is generated by `expo prebuild`
# in this workflow, then the action runs Gradle inside it.

name: Build PCF4U (APK + AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: 'Upload the signed AAB to the Google Play internal track'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PACKAGE_NAME: com.pcf4u.app # must match android.package in app.json
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Use the npm cache only when package-lock.json is committed (otherwise setup-node fails).
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the old 'tools' package, which no longer exists in the SDK
          # repository ("Failed to find package 'tools'"). Gradle downloads the platform / build-tools it needs.
          packages: platform-tools

      - name: Install JS dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json is not at the repository root. Upload the CONTENTS of the PCF4U folder (App.tsx, package.json, src/ …) to the root, not the PCF4U folder itself."
            exit 1
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is missing – using npm install. Commit package-lock.json for repeatable builds."
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---------- APK: install on phones (signed with the debug key from the Expo template) ----------
      - name: Build Android App (APK)
        uses: sparkfabrik/android-build-action@v1.5.0
        with:
          build-type: assemble
          gradle-task: assembleRelease
          project-path: android
          output-path: pcf4u-release.apk
          ruby-version: '3.2'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcf4u-apk
          path: pcf4u-release.apk
          if-no-files-found: error

      # ---------- AAB: signed with your upload key, for Google Play ----------
      - name: Build Android App (signed AAB)
        if: env.HAS_KEYSTORE == 'true'
        uses: sparkfabrik/android-build-action@v1.5.0
        with:
          build-type: bundle
          gradle-task: bundleRelease
          project-path: android
          output-path: pcf4u-release.aab
          package-name: ${{ env.PACKAGE_NAME }}
          keystore-content: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ruby-version: '3.2'
          # Play Store upload only on a manual run with the box ticked:
          upload-to-play-store: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_play_store }}
          json-key-data: ${{ secrets.PLAY_STORE_JSON_KEY }}
          release-track: internal
          release-status: draft

      - name: Upload AAB artifact
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pcf4u-aab
          path: pcf4u-release.aab
          if-no-files-found: error

      - name: Note when no AAB was built
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::AAB skipped – add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets to build a signed AAB for Google Play."
